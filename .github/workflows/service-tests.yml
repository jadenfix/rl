name: Service regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python demo/verify_artifacts.py
      - run: python -m pip install -r apps/gateway/requirements.txt -r apps/collector/requirements.txt pytest-asyncio==1.3.0
      - run: python -m pytest --rootdir=. apps/gateway/tests apps/collector/tests apps/reward/tests apps/trainer/tests -q
  trainer-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t rlaas-trainer:test apps/trainer
      - run: python scripts/trainer_container_e2e.py
